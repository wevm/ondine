name: Verify
on:
  workflow_call:
  workflow_dispatch:

jobs:
  wasm:
    name: Build WebAssembly
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build modules
        uses: ./.github/actions/wasm-modules
        with:
          build: 'true'

  checks:
    name: Checks
    needs: wasm
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Check code
        run: pnpm check

      - name: Restore WebAssembly
        uses: ./.github/actions/wasm-modules

      - name: Check generated exports
        run: git diff --exit-code package.json

      - name: Check types
        run: pnpm check:types

  packed:
    name: Test Packed
    needs: wasm
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Restore WebAssembly
        uses: ./.github/actions/wasm-modules

      - name: Run packed-consumer test
        run: pnpm test:packed

  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

  swift:
    name: Swift
    needs: wasm
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Restore WebAssembly
        uses: ./.github/actions/wasm-modules

      # WasmKit 0.4 needs Swift 6.3.
      - name: Run tests
        run: docker run --rm --volume "$PWD:/ondine" --workdir /ondine swift:6.3-noble swift test

  test:
    name: Test Runtime
    needs: wasm
    # Playwright 1.56.1, pinned to the Chromium the screenshot baselines were captured in, installs
    # its browser dependencies only up to Ubuntu 24.04.
    runs-on: ubuntu-24.04

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Restore WebAssembly
        uses: ./.github/actions/wasm-modules

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm run test --bail=1
        env:
          CI: true

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          # Vitest writes diffs under a dot directory, which the action skips by default.
          include-hidden-files: true
          name: screenshot-diffs
          path: .vitest-attachments
