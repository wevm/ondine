name: Main
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  changesets:
    name: Changesets
    needs: verify
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    # A WebAssembly cache miss rebuilds every module before publishing.
    timeout-minutes: 20

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Restore WebAssembly
        uses: ./.github/actions/wasm-modules
        with:
          build: 'true'

      - name: PR or publish
        id: changesets
        uses: wevm/actions/vendor/changesets/action/v2@31d7c5bc5f75932a367cf341ca5e26818eb9ec9d
        with:
          commit-message: 'chore: version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: 'chore: version packages'
          publish-script: pnpm run changeset:publish
          push-with-git-cli: true
          version-script: pnpm run changeset:version

  deploy:
    name: Deploy
    needs: verify
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
