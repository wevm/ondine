name: Benchmarks
on:
  workflow_dispatch:

jobs:
  compare:
    name: Compare with Pele and Mermaid
    # Playwright 1.56.1 installs its browser dependencies only up to Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Restore WebAssembly
        uses: ./.github/actions/wasm-modules
        with:
          build: 'true'

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run comparison
        run: pnpm exec tsx bench/compare.ts

      - name: Write summary
        run: cat bench/results/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: comparison
          path: |
            bench/results/comparison.json
            bench/results/comparison.md
