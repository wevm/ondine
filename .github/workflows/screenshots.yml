name: Screenshots
on:
  workflow_dispatch:

jobs:
  capture:
    name: Capture Baselines
    # Baselines are compared on this runner image in Verify, so they are captured here too.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Restore WebAssembly
        uses: ./.github/actions/wasm-modules
        with:
          build: 'true'

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture screenshots
        run: pnpm test:screenshots

      - name: Upload baselines
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-baselines
          path: src/__screenshots__
