name: Deploy
on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    permissions:
      contents: read
    # Deploys run one at a time, in push order, and never cancel each other mid-upload.
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Restore WebAssembly
        uses: ./.github/actions/wasm-modules
        with:
          build: 'true'

      - name: Deploy site
        run: pnpm --dir site run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
