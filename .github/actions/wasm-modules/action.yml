name: 'WebAssembly modules'
description: 'Restore the built WebAssembly modules, and build them only when their inputs changed'

inputs:
  build:
    description: 'Build the modules when the cache misses. Jobs that only consume them leave this off.'
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Restore modules
      id: cache
      uses: actions/cache@v6
      with:
        key: wasm-${{ hashFiles('crates/**', 'Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'scripts/build-wasm.ts', 'pnpm-lock.yaml') }}
        path: |
          src/internal/*.generated.*
          target/wasm.stamp
          test/oracles/model.generated.wasm

    - name: Install toolchains
      if: steps.cache.outputs.cache-hit != 'true' && inputs.build == 'true'
      shell: bash
      run: |
        rustup show
        rustup toolchain install nightly-2026-06-29 --profile minimal --component rust-src --target wasm32-unknown-unknown

    - name: Build modules
      if: steps.cache.outputs.cache-hit != 'true' && inputs.build == 'true'
      shell: bash
      run: pnpm build:wasm

    - name: Require modules
      if: steps.cache.outputs.cache-hit != 'true' && inputs.build != 'true'
      shell: bash
      run: |
        echo "No built WebAssembly modules for this commit. Run the Build WebAssembly job first."
        exit 1
