[package]
name = "compiler"
description = "Pure Mermaid-to-SVG compiler: preprocessing, parsing, layout, and SVG emission."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["all", "theme"]
# Every diagram type, for native builds and tests.
all = [
  "agentflow",
  "architecture",
  "block",
  "c4",
  "class",
  "cynefin",
  "er",
  "eventmodeling",
  "flowchart",
  "gantt",
  "git",
  "info",
  "ishikawa",
  "journey",
  "kanban",
  "mindmap",
  "packet",
  "pie",
  "quadrant",
  "radar",
  "railroad",
  "requirement",
  "sankey",
  "sequence",
  "state",
  "swimlane",
  "timeline",
  "treemap",
  "treeview",
  "usecase",
  "venn",
  "wardley",
  "xychart",
]
# Each diagram type compiles only into the modules that render it.
agentflow = []
architecture = []
block = []
c4 = []
class = []
cynefin = []
er = []
eventmodeling = []
flowchart = []
gantt = []
git = []
info = []
ishikawa = []
journey = []
kanban = []
mindmap = []
packet = []
pie = []
quadrant = []
radar = []
railroad = []
requirement = []
sankey = []
sequence = []
state = []
swimlane = []
timeline = []
treemap = []
treeview = []
usecase = []
venn = []
wardley = []
xychart = []
# Serializes parsed models as JSON for parity tests. Release modules leave it out.
model = []
# Writes the `theme` render option into the SVG as literal values. Only the speed-optimized `all`
# module includes it, so the size-optimized browser modules leave out the resolve pass.
theme = []

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
