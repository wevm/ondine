[package]
name = "wasm"
description = "WebAssembly adapter that exposes the Ondine compiler to JavaScript hosts."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["flowchart"]
# Every diagram type, for the root entrypoint and tests.
all = ["compiler/all"]
agentflow = ["compiler/agentflow"]
architecture = ["compiler/architecture"]
block = ["compiler/block"]
c4 = ["compiler/c4"]
class = ["compiler/class"]
cynefin = ["compiler/cynefin"]
er = ["compiler/er"]
eventmodeling = ["compiler/eventmodeling"]
flowchart = ["compiler/flowchart"]
gantt = ["compiler/gantt"]
git = ["compiler/git"]
info = ["compiler/info"]
ishikawa = ["compiler/ishikawa"]
journey = ["compiler/journey"]
kanban = ["compiler/kanban"]
mindmap = ["compiler/mindmap"]
packet = ["compiler/packet"]
pie = ["compiler/pie"]
quadrant = ["compiler/quadrant"]
radar = ["compiler/radar"]
railroad = ["compiler/railroad"]
requirement = ["compiler/requirement"]
sankey = ["compiler/sankey"]
sequence = ["compiler/sequence"]
state = ["compiler/state"]
swimlane = ["compiler/swimlane"]
timeline = ["compiler/timeline"]
treemap = ["compiler/treemap"]
treeview = ["compiler/treeview"]
usecase = ["compiler/usecase"]
venn = ["compiler/venn"]
wardley = ["compiler/wardley"]
xychart = ["compiler/xychart"]
model = ["compiler/model"]
theme = ["compiler/theme"]

[dependencies]
compiler.workspace = true

[lints]
workspace = true
